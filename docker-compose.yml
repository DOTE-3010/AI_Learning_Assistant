version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_learning_assistant-backend
    ports:
      - "14242:8000"
    depends_on:
      - postgres
      - mongo
    env_file:
      - .env
    environment:
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/ai_learning_assistant
      - MONGODB_URL=mongodb://mongo:27017
    volumes:
      - ./workspace:/app/workspace

  postgres:
    image: postgres:15-alpine
    container_name: ai_learning_assistant-postgres
    ports:
      - "15432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_learning_assistant
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7.0
    container_name: ai_learning_assistant-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
